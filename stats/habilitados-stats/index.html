<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CEPREUNA - Habilitados en vivo</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: {
                "primary": "#003366", "primary-light": "#004080",
                "background-light": "#f5f7f8", "background-dark": "#0f1923",
            }, fontFamily: { "display": ["Inter", "sans-serif"] } } },
        }
    </script>
    <style>
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .live-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
        .table-fixed-head thead th { position: sticky; top: 0; z-index: 5; background-color: #f1f5f9; }
        .dark .table-fixed-head thead th { background-color: #1e293b; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
    <script>
        const sessionDataString = localStorage.getItem('stats_session');
        const sessionData = sessionDataString ? JSON.parse(sessionDataString) : null;
        function _tokenVencido(t) { try { const p = JSON.parse(atob(String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return !p.exp || p.exp * 1000 < Date.now(); } catch (e) { return true; } }
        if (!sessionData || !sessionData.token || String(sessionData.token).startsWith('valid_session_token_') || _tokenVencido(sessionData.token)) { localStorage.removeItem('stats_session'); window.location.href = '/stats/login'; }
        // Accesible para todos los roles autenticados: el backend filtra por grupos.
    </script>

    <div class="min-h-screen flex flex-col">
        <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 lg:px-8 sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <a href="/stats/habilitados" class="text-slate-400 hover:text-primary"><span class="material-symbols-outlined">arrow_back</span></a>
                <span class="material-symbols-outlined text-emerald-600">how_to_reg</span>
                <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Habilitados · En vivo</h2>
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600 text-[11px] font-black uppercase tracking-widest"><span class="live-dot inline-block w-2 h-2 rounded-full bg-emerald-500"></span>En vivo</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-slate-400" id="lastUpdate">—</span>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition-colors"><span class="material-symbols-outlined text-xl" id="themeIcon">dark_mode</span></button>
                <button id="logoutBtn" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-slate-500 hover:text-red-600 transition-colors" title="Cerrar Sesión"><span class="material-symbols-outlined text-xl">logout</span></button>
            </div>
        </header>

        <main class="flex-1 p-6 lg:p-10 max-w-[1500px] mx-auto w-full space-y-6">
            <!-- KPIs -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 lg:p-8">
                    <p class="text-[11px] font-black uppercase tracking-widest text-slate-500">Matriculados</p>
                    <p class="text-5xl lg:text-6xl font-black mt-2" id="kInsc">—</p>
                </div>
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 lg:p-8">
                    <p class="text-[11px] font-black uppercase tracking-widest text-emerald-600">Habilitados</p>
                    <p class="text-5xl lg:text-6xl font-black mt-2 text-emerald-600" id="kHab">—</p>
                    <p class="text-sm text-slate-400 mt-1" id="kHabPct">—</p>
                    <div class="mt-3 h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div id="kHabBar" class="h-full rounded-full bg-emerald-500 transition-all duration-700" style="width:0%"></div></div>
                </div>
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 lg:p-8">
                    <p class="text-[11px] font-black uppercase tracking-widest text-primary dark:text-sky-400">Sincronizados</p>
                    <p class="text-5xl lg:text-6xl font-black mt-2 text-primary dark:text-sky-400" id="kSinc">—</p>
                    <p class="text-sm text-slate-400 mt-1" id="kSincPct">—</p>
                    <div class="mt-3 h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div id="kSincBar" class="h-full rounded-full bg-sky-500 transition-all duration-700" style="width:0%"></div></div>
                </div>
            </div>

            <!-- Por sede + Por área -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800"><h3 class="font-bold text-sm flex items-center gap-2"><span class="material-symbols-outlined text-base text-sky-600">location_on</span>Por sede</h3></div>
                    <div class="overflow-x-auto table-fixed-head"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 uppercase tracking-tight text-xs"><th class="px-6 py-2.5 font-bold">Sede</th><th class="px-6 py-2.5 font-bold text-right">Matric.</th><th class="px-6 py-2.5 font-bold text-right">Habil.</th><th class="px-6 py-2.5 font-bold text-right">Sincr.</th><th class="px-6 py-2.5 font-bold text-right">% Sinc.</th></tr></thead><tbody id="tbodySede"></tbody></table></div>
                </div>
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800"><h3 class="font-bold text-sm flex items-center gap-2"><span class="material-symbols-outlined text-base text-sky-600">category</span>Por área</h3></div>
                    <div class="overflow-x-auto table-fixed-head"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 uppercase tracking-tight text-xs"><th class="px-6 py-2.5 font-bold">Área</th><th class="px-6 py-2.5 font-bold text-right">Estud.</th><th class="px-6 py-2.5 font-bold text-right">Sincr.</th><th class="px-6 py-2.5 font-bold text-right">% Sinc.</th></tr></thead><tbody id="tbodyArea"></tbody></table></div>
                </div>
            </div>

            <p class="text-center text-xs text-slate-400">Se actualiza automáticamente cada <b>15 segundos</b> · datos sin caché</p>
        </main>
    </div>

    <script>
        function handleLogout() { localStorage.removeItem('stats_session'); window.location.href = '/stats/login'; }
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);

        const themeIcon = document.getElementById('themeIcon');
        function applyTheme(d) { document.documentElement.classList.toggle('dark', d); themeIcon.textContent = d ? 'light_mode' : 'dark_mode'; localStorage.setItem('stats_theme', d ? 'dark' : 'light'); }
        applyTheme(localStorage.getItem('stats_theme') === 'dark');
        document.getElementById('themeToggle').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

        const authHeaders = { 'Authorization': 'Bearer ' + sessionData.token };
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmt = n => Number(n || 0).toLocaleString('es-PE');
        const pct = (a, b) => b > 0 ? Math.round(100 * a / b) + '%' : '—';

        // Efecto odómetro: el número "rueda" desde el valor anterior hasta el nuevo.
        function animar(el, target) {
            if (!el) return;
            const to = Number(target) || 0;
            const from = Number(el.dataset.val ?? 0);
            el.dataset.val = to;
            if (from === to) { el.textContent = fmt(to); return; }
            if (el._raf) cancelAnimationFrame(el._raf);
            const dur = 900, t0 = performance.now();
            const paso = t => {
                const p = Math.min(1, (t - t0) / dur);
                const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
                el.textContent = fmt(Math.round(from + (to - from) * e));
                if (p < 1) el._raf = requestAnimationFrame(paso);
            };
            el._raf = requestAnimationFrame(paso);
        }

        // Tablas: se construye la estructura una vez (por juego de filas) y luego
        // solo se animan las celdas numéricas, para que el odómetro funcione.
        function renderSedes(sedes) {
            const tb = document.getElementById('tbodySede');
            const keys = sedes.map(s => s.sede).join('|');
            if (tb.dataset.keys !== keys) {
                tb.dataset.keys = keys;
                tb.innerHTML = sedes.map((s, i) => `
                    <tr class="border-b border-slate-50 dark:border-slate-800/50">
                        <td class="px-6 py-2 font-medium">${esc(s.sede)}</td>
                        <td class="px-6 py-2 text-right font-mono" id="sd${i}m"></td>
                        <td class="px-6 py-2 text-right font-mono text-emerald-600 font-bold" id="sd${i}h"></td>
                        <td class="px-6 py-2 text-right font-mono" id="sd${i}s"></td>
                        <td class="px-6 py-2 text-right font-mono font-bold" id="sd${i}p"></td>
                    </tr>`).join('') || `<tr><td colspan="5" class="text-center py-6 text-slate-400">Sin datos.</td></tr>`;
            }
            sedes.forEach((s, i) => {
                animar(document.getElementById(`sd${i}m`), s.total_inscritos);
                animar(document.getElementById(`sd${i}h`), s.total_habilitados);
                animar(document.getElementById(`sd${i}s`), s.total_sincronizados);
                const p = document.getElementById(`sd${i}p`); if (p) p.textContent = pct(s.total_sincronizados, s.total_inscritos);
            });
        }
        function renderAreas(areas) {
            const tb = document.getElementById('tbodyArea');
            const keys = areas.map(a => a.area).join('|');
            if (tb.dataset.keys !== keys) {
                tb.dataset.keys = keys;
                tb.innerHTML = areas.map((a, i) => `
                    <tr class="border-b border-slate-50 dark:border-slate-800/50">
                        <td class="px-6 py-2 font-medium">${esc(a.area)}</td>
                        <td class="px-6 py-2 text-right font-mono" id="ar${i}e"></td>
                        <td class="px-6 py-2 text-right font-mono text-emerald-600 font-bold" id="ar${i}s"></td>
                        <td class="px-6 py-2 text-right font-mono font-bold" id="ar${i}p"></td>
                    </tr>`).join('') || `<tr><td colspan="4" class="text-center py-6 text-slate-400">Sin datos.</td></tr>`;
            }
            areas.forEach((a, i) => {
                animar(document.getElementById(`ar${i}e`), a.total_estudiantes);
                animar(document.getElementById(`ar${i}s`), a.total_sincronizados);
                const p = document.getElementById(`ar${i}p`); if (p) p.textContent = a.porcentaje_sincronizados != null ? a.porcentaje_sincronizados + '%' : pct(a.total_sincronizados, a.total_estudiantes);
            });
        }

        async function cargar() {
            try {
                const r = await fetch('/api/stats/habilitados/resumen-live', { headers: authHeaders, cache: 'no-store' });
                if (r.status === 401) { localStorage.removeItem('stats_session'); window.location.href = '/stats/login'; return; }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const d = await r.json();
                const t = d.totales || {};
                animar(document.getElementById('kInsc'), t.total_inscritos);
                animar(document.getElementById('kHab'), t.total_habilitados);
                document.getElementById('kHabPct').textContent = pct(t.total_habilitados, t.total_inscritos) + ' de matriculados';
                document.getElementById('kHabBar').style.width = (t.total_inscritos > 0 ? Math.round(100 * t.total_habilitados / t.total_inscritos) : 0) + '%';
                animar(document.getElementById('kSinc'), t.total_sincronizados);
                document.getElementById('kSincPct').textContent = pct(t.total_sincronizados, t.total_habilitados) + ' de habilitados';
                document.getElementById('kSincBar').style.width = (t.total_habilitados > 0 ? Math.round(100 * t.total_sincronizados / t.total_habilitados) : 0) + '%';
                renderSedes(d.sedes || []);
                renderAreas(d.areas || []);
                document.getElementById('lastUpdate').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            } catch (e) { console.error(e); document.getElementById('lastUpdate').textContent = 'Error al actualizar — reintentando…'; }
        }

        // Poll cada 15s; se pausa cuando la pestaña no está visible.
        const INTERVALO = 15000;
        let timer = null;
        function iniciar() { if (!timer) { cargar(); timer = setInterval(cargar, INTERVALO); } }
        function pausar() { if (timer) { clearInterval(timer); timer = null; } }
        document.addEventListener('visibilitychange', () => { document.hidden ? pausar() : iniciar(); });
        iniciar();
    </script>
</body>
</html>
